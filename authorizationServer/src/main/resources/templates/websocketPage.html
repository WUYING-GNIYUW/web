<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title>SockJS + STOMP 测试页面 - Vue版本</title>
    <!-- 引入Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入Axios用于AJAX请求 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- 引入SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        :root{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;}
        body{margin:0;background:#f5f7fb;color:#0f172a;display:flex;align-items:center;justify-content:center;height:100vh}
        .card{width:980px;max-width:96%;background:#fff;border-radius:12px;box-shadow:0 6px 30px rgba(11,14,23,0.08);padding:20px}
        .row{display:flex;gap:12px;align-items:center}
        label{font-size:13px;color:#334155}
        input[type=text], textarea, select{padding:8px 10px;border:1px solid #e6e9ef;border-radius:8px;font-size:13px}
        button{padding:8px 12px;border-radius:8px;border:0;background:#2563eb;color:#fff;cursor:pointer}
        button.ghost{background:#f1f5f9;color:#0f172a}
        button:disabled{background:#94a3b8;cursor:not-allowed}
        .controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
        .panel{margin-top:14px;border-radius:8px;border:1px solid #eef2ff;padding:12px;background:#fbfdff}
        .log{height:280px;overflow:auto;background:#0b1220;color:#e6eef8;padding:10px;border-radius:8px;font-family:monospace;font-size:13px}
        .status{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:600}
        .connected{background:#dcfce7;color:#166534}
        .connecting{background:#fef3c7;color:#92400e}
        .closed{background:#fee2e2;color:#7f1d1d}
        .loading{background:#dbeafe;color:#1e40af}
        textarea{width:100%;min-height:60px}
        .flex{display:flex;gap:12px}
        .grow{flex:1}
        .meta{font-size:12px;color:#64748b}
        .api-data-section{margin-top:16px;padding:12px;background:#f0f9ff;border-radius:8px;border:1px solid#bae6fd}
        .api-data-title{font-size:14px;font-weight:600;margin-bottom:8px;color:#0369a1}
        .api-data-content{font-size:13px;background:#ffffff;padding:8px;border-radius:4px;border:1px solid#e0f2fe;min-height:40px}
    </style>
</head>
<body>
<div id="app">
    <div class="card">
        <h2>SockJS + STOMP 前端示例 - Vue版本</h2>

        <!-- API数据展示区域 -->
        <div class="api-data-section" v-if="apiData">
            <div class="api-data-title">从后端API获取的数据：</div>
            <div class="api-data-content">{{ apiData }}</div>
        </div>

        <div class="row" style="justify-content:space-between">
            <div>
                <label>WebSocket 端点</label>
                <input v-model="wsEndpoint" type="text" style="width:240px" />
            </div>

            <div style="text-align:right">
                <div>连接状态：
                    <span class="status" :class="connectionStatus.toLowerCase()">{{ connectionStatus }}</span>
                </div>
                <div>API状态：
                    <span class="status loading" v-if="apiLoading">LOADING</span>
                    <span class="status connected" v-else-if="apiData">LOADED</span>
                    <span class="status closed" v-else>NOT_LOADED</span>
                </div>
                <div class="controls">
                    <button @click="connect" :disabled="isConnected">连接</button>
                    <button @click="disconnect" class="ghost" :disabled="!isConnected">断开</button>
                    <button @click="clearLog" class="ghost">清空日志</button>
                    <button @click="fetchApiData" class="ghost" :disabled="apiLoading">
                        {{ apiLoading ? '请求中...' : '重新获取API数据' }}
                    </button>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="flex">
                <div style="width:48%">
                    <label>接收日志</label>
                    <div class="log">
                        <div v-for="(logEntry, index) in logs" :key="index">
                            [{{ logEntry.time }}] {{ logEntry.message }}
                        </div>
                    </div>
                </div>

                <div style="width:52%">
                    <label>发送消息（后端决定广播或私发）</label>
                    <textarea v-model="sendText" placeholder="输入要发送的消息"></textarea>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
                        <div class="meta">发送到后端统一处理（示例：/app/message）</div>
                        <div>
                            <button @click="sendMessage" :disabled="!isConnected">发送</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
        setup() {
            // 响应式数据
            const wsEndpoint = ref('/user/ws');
            const logs = ref([]);
            const connectionStatus = ref('CLOSED');
            const sendText = ref('');
            const stompClient = ref(null);
            const apiData = ref(null);
            const apiLoading = ref(false);

            // 固定API URL - 根据你的实际后端API修改这个URL
            const API_URL = '/api/user/info_of_conversations'; // 示例URL，请替换为你的实际API端点

            // 计算属性
            const isConnected = computed(() => connectionStatus.value === 'CONNECTED');

            // 方法
            const log = (message) => {
                const time = new Date().toLocaleTimeString();
                logs.value.push({ time, message });
                // 限制日志数量，避免内存溢出
                if (logs.value.length > 1000) {
                    logs.value = logs.value.slice(-500);
                }
            };

            const setStatus = (status) => {
                connectionStatus.value = status;
            };

            const connect = () => {
                const endpoint = wsEndpoint.value || '/user/ws';
                log(`尝试连接到 SockJS 端点：${endpoint}`);
                setStatus('CONNECTING');

                const socket = new SockJS(endpoint);
                stompClient.value = Stomp.over(socket);
                stompClient.value.debug = null;

                stompClient.value.connect({}, (frame) => {
                    setStatus('CONNECTED');
                    log('连接成功: ' + frame);

                    // 订阅公共频道
                    stompClient.value.subscribe('/topic/public', (message) => {
                        log('接收到 /topic/public : ' + message.body);
                    });

                    // 订阅私有消息频道
                    stompClient.value.subscribe('/user/queue/messages', (message) => {
                        log('接收到 /user/queue/messages : ' + message.body);
                    });

                    log('订阅完成（前端只是订阅，消息是否广播或私发由后端决定）');
                }, (err) => {
                    setStatus('CLOSED');
                    log('连接出错: ' + err);
                });
            };

            const disconnect = () => {
                if (stompClient.value) {
                    try {
                        stompClient.value.disconnect(() => {
                            log('已断开连接');
                        });
                    } catch(e) {
                        log('断开连接时出错: ' + e);
                    }
                    setStatus('CLOSED');
                    stompClient.value = null;
                } else {
                    log('当前未连接');
                }
            };

            const sendMessage = () => {
                if (!stompClient.value || !stompClient.value.connected) {
                    log('未连接，无法发送');
                    return;
                }
                const text = sendText.value.trim();
                if (!text) {
                    log('请输入消息内容');
                    return;
                }

                stompClient.value.send('/app/message', {}, JSON.stringify({ message: text }));
                log('发送到后端统一入口 /app/message ：' + text);
                sendText.value = ''; // 清空输入框
            };

            const clearLog = () => {
                logs.value = [];
            };

            // 新增：获取API数据的方法
            const fetchApiData = async () => {
                apiLoading.value = true;
                try {
                    log('开始请求后端API数据...');
                    const response = await axios.get(API_URL);
                    apiData.value = response.data;
                    log(`API数据获取成功: ${JSON.stringify(response.data)}`);
                } catch (error) {
                    log(`API请求失败: ${error.message}`);
                    apiData.value = null;
                } finally {
                    apiLoading.value = false;
                }
            };

            // 生命周期钩子
            onMounted(() => {
                log('页面加载完成，开始初始化...');
                // 页面加载时自动获取API数据
                fetchApiData();
            });

            // 返回所有在模板中使用的数据和方法
            return {
                wsEndpoint,
                logs,
                connectionStatus,
                sendText,
                apiData,
                apiLoading,
                isConnected,
                connect,
                disconnect,
                sendMessage,
                clearLog,
                fetchApiData
            };
        }
    }).mount('#app');
</script>
</body>
</html>
