<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Login Page</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{
          --accent: #ff8a00;
          --accent-dark: #ff4a00;
          --accent-rgb: 255,138,0;

          --glass: rgba(255,255,255,0.03);  /* 常用微透明边框 */
          --muted: #9da3a8;                 /* 常用中性灰 */

          --radius: 18px;
          --halo-offset: 14px;
          --halo-pad: 14px;

          --card-maxw: 560px;
          --bg: #080808;
          --panel: #0b0b0b;             /* 主卡片不透明黑色 */
          --input-bg: #0f0f0f;
          --input-h: 52px;
        }

        /* 基础 reset / 布局 */
        *{ box-sizing:border-box; margin:0; padding:0; }
        html,body{ height:100%; }
        body{
          font-family: "Segoe UI","Microsoft YaHei",Arial,sans-serif;
          background: linear-gradient(180deg,var(--bg), #8f8889 100%);
          color:#eaeaea;
          -webkit-font-smoothing:antialiased;
          display:flex;
          align-items:center;
          justify-content:center;
          padding:32px;
        }

        .wrap{
          width:100%;
          max-width:var(--card-maxw);
          position:relative;
        }

        /* header image（你用的 1375x723 图片） */
        .header-image-wrapper{
            display:flex;
            justify-content:center;
            align-items:center;
            width:100%;
            margin-bottom:12px;
        }
        .header-image{
            display:block;
            width:100%;
            max-width:560px;   /* 与卡片宽度匹配 */
            height:auto;
            border-radius:12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
            object-fit:cover;
        }

        /* 公共：第三方登录区域（合并重复项） */
        .oauth{ display:flex; justify-content:center; margin-top:4px; gap:14px; }
        .oauth > * {
          display:inline-flex;
          align-items:center;
          gap:10px;
          padding:12px 18px;
          border-radius:10px;
          background:#0f0f0f;
          color:#eaeaea;
          border:1px solid var(--glass);
          text-decoration:none;
          min-width:220px;
          justify-content:center;
          cursor:pointer;
        }
        /* notice-btn 是 oauth 下的特殊样式（圆角 pill + 渐变）*/
        .oauth .notice-btn{
          padding:10px 18px;
          border-radius:999px;
          border: 1px solid rgba(255,106,0,0.14);
          background: linear-gradient(90deg, rgba(255,106,0,0.06), rgba(255,59,0,0.04));
          color: var(--accent);
          font-weight:600;
          font-size:13px;
          transition:all .18s;
        }
        .oauth .notice-btn:hover{
          transform:translateY(-2px);
          box-shadow:0 8px 20px rgba(var(--accent-rgb),0.10);
        }
        .oauth .fa-github{ color: var(--accent); }
        .notice-btn i { margin-right:6px; }

        /* Halo：背阴（上 & 右露出）*/
        .halo{
          position:absolute;
          top: calc(-1 * var(--halo-offset));
          right: calc(-1 * var(--halo-offset));
          left: var(--halo-pad);
          bottom: var(--halo-pad);
          z-index:0;
          background: linear-gradient(90deg, var(--accent), var(--accent-dark));
          box-shadow: 0 18px 48px rgba(var(--accent-rgb), 0.12);
          border-radius: calc(var(--radius) + var(--halo-offset));
          pointer-events:none;
        }

        /* 卡片主体 */
        .card{
          position:relative;
          z-index:2;
          border-radius: var(--radius);
          overflow:hidden;
          background: var(--panel);
          border: 1px solid var(--glass);
          box-shadow: 0 12px 36px rgba(0,0,0,0.75);
        }

        .corner-overlay{
          position:absolute;
          top:0;
          left:0;
          width: calc(var(--radius) + 6px);
          height: calc(var(--radius) + 6px);
          border-top-left-radius: var(--radius);
          background: var(--panel);
          z-index:3;
          pointer-events:none;
          box-shadow: inset 0 -6px 12px rgba(0,0,0,0.35);
        }

        /* header 与 body 共享 z-index（合并写法） */
        .card-header, .card-body {
          position:relative;
          z-index:4;
        }
        .card-header{
          padding:34px 28px 18px;
          text-align:center;
        }

        /* logo-mark 保留（你可注释掉如果不用） */
        .logo-mark{
          width:56px;
          height:56px;
          border-radius:12px;
          display:inline-flex;
          align-items:center;
          justify-content:center;
          font-weight:700;
          color:#111;
          font-size:18px;
          background: linear-gradient(135deg,var(--accent),var(--accent-dark));
          box-shadow: 0 8px 26px rgba(var(--accent-rgb),0.14);
          margin-bottom:10px;
        }

        .title{
          font-size:26px;
          font-weight:700;
          color:#fff;
          margin-bottom:6px;
        }

        .card-body{
          padding:24px 26px 30px;
        }

        /* 表单样式 */
        label{ display:block; color:var(--muted); font-size:12px; margin-bottom:8px; }
        .control{ position:relative; margin-bottom:18px; }
        input[type="text"], input[type="password"]{
          width:100%;
          height:var(--input-h);
          padding:0 62px 0 14px; /* 右侧预留图标区域 */
          border-radius:10px;
          background:var(--input-bg);
          border:1px solid var(--glass);
          color:#eaeaea;
          font-size:15px;
          transition: all .18s;
        }
        input::placeholder{ color:#666; }
        input:focus{
          outline:none;
          border-color: rgba(var(--accent-rgb),0.14);
          box-shadow: 0 6px 18px rgba(var(--accent-rgb),0.06);
          background:#141414;
        }

        /* 右侧图标容器 */
        .input-icon {
          position:absolute;
          right:12px;
          top:65%;
          transform:translateY(-50%);
          width:36px;
          height:36px;
          border-radius:8px;
          display:inline-flex;
          align-items:center;
          justify-content:center;
          background: rgba(255,255,255,0.02);
          color:#bdbdbd;
          font-size:16px;
          transition: all .15s;
          pointer-events:none;
        }
        .input-icon > * { display:block; }

        /* 按钮：基础 + 变体 */
        .btn-row{ display:flex; gap:12px; margin-top:6px; align-items:center; }
        .btn{
          flex:1;
          height:52px;
          border-radius:10px;
          font-weight:700;
          cursor:pointer;
          border:0;
          font-size:15px;
          transition:all .18s;
        }
        .btn-primary{
          background: linear-gradient(135deg,var(--accent) 0%, var(--accent-dark) 100%);
          color:#121212;
          box-shadow: 0 12px 34px rgba(var(--accent-rgb),0.16);
        }
        .btn-primary:hover{ transform:translateY(-3px); box-shadow: 0 20px 50px rgba(var(--accent-rgb),0.18); }
        .btn-secondary{
          background:transparent;
          border:1px solid rgba(255,255,255,0.05);
          color:#c8c8c8;
        }
        .btn-secondary:hover{ background: rgba(255,255,255,0.02); transform:translateY(-2px); }

        /* 分隔线 */
        .divider{
          display:flex;
          align-items:center;
          gap:12px;
          color:var(--muted);
          margin:22px 0;
          font-size:13px;
        }
        .divider::before, .divider::after{
          content:''; flex:1; height:1px;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
        }

        .oauth a{ /* 如果你也使用 <a> 链接登录 的情况，确保视觉一致 */
          display:inline-flex;
        }

        .card-footer{
          padding:14px 22px;
          text-align:center;
          color:var(--muted);
          font-size:13px;
          border-top:1px solid rgba(255,255,255,0.02);
        }

        .decor{
          position:absolute;
          width:200px;height:200px;border-radius:50%;
          filter:blur(36px); opacity:0.06; pointer-events:none;
        }
        .decor.d1{ right:-60px; top:-60px; background: linear-gradient(135deg, var(--accent), transparent); }
        .decor.d2{ left:-60px; bottom:-60px; background: linear-gradient(135deg, var(--accent-dark), transparent); }

        /* 响应式：只覆盖必要变量与尺寸 */
        @media (max-width:520px){
          :root{ --halo-offset: 10px; --halo-pad: 10px; --radius: 14px; --card-maxw: 420px; }
          .logo-mark{ width:48px; height:48px; }
          .title{ font-size:20px; }
          .btn-row{ flex-direction:column; }
          .input-icon{ width:34px; height:34px; right:10px; }
          input{ padding:0 56px 0 12px; }
          .header-image{ max-width:320px; }
          .header-image-wrapper{ margin-bottom:10px; }
        }
    </style>
</head>
<body>
<div class="wrap" role="main">
    <!-- 橙色背阴 -->
    <div class="halo" aria-hidden="true"></div>

    <div class="card" role="dialog" aria-label="登录面板">
        <div class="corner-overlay" aria-hidden="true"></div>

        <div class="card-header">
            <div class="header-image-wrapper">
                <img src="/public/getResource?type=static&format=img&resource_name=GS&file_extension=png" class="header-image">
            </div>
        </div>

        <div class="card-body">
            <form @submit.prevent="onSubmit" class="login-form" action="/login" method="post">
                <div class="control">
                    <label for="userId">用户名</label>
                    <input id="userId" name="userId" type="text" v-model="form.userId" required />
                    <div class="input-icon" aria-hidden="true"><i class="fa fa-user"></i></div>
                </div>

                <div class="control">
                    <label for="password">密码</label>
                    <input id="password" name="password" type="password" v-model="form.password" required />
                    <div class="input-icon" aria-hidden="true"><i class="fa fa-lock"></i></div>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn btn-primary">登录</button>
                    <button type="button" @click="resetForm" class="btn btn-secondary">取消</button>
                </div>
            </form>

            <div class="divider">第三方登录</div>

            <div class="oauth">
                <button class="notice-btn" type="button"><i class="fab fa-github"></i>github</button>
                <button class="notice-btn" type="button"><i class="fab fa-weixin"></i>wechat</button>
            </div>
        </div>

        <div class="card-footer">© 2025 &nbsp;|&nbsp; <a href="#" style="color:var(--accent);text-decoration:none">隐私政策</a></div>

        <div class="decor d1" aria-hidden="true"></div>
        <div class="decor d2" aria-hidden="true"></div>
    </div>
</div>

<script>
    const { createApp, ref } = Vue;
    createApp({
      setup(){
        const form = ref({ userId:'', password:'' });

        function resetForm(){
          form.value.userId = '';
          form.value.password = '';
        }

        function onSubmit(){
          if(!form.value.userId || !form.value.password){
            alert('请填写用户名和密码');
            return;
          }
          document.querySelector('.login-form').submit();
        }

        return { form, resetForm, onSubmit };
      }
    }).mount('body');
</script>
</body>
</html>
